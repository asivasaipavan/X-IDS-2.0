services:
  postgres:
    image: postgres:16-alpine
    container_name: xids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xids
      POSTGRES_USER: xids
      POSTGRES_PASSWORD: xids_local_dev
    ports:
      - "5432:5432"
    volumes:
      - xids_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xids -d xids"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  xids_postgres_data:
